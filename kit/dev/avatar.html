<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plush avatar</title>
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- Dev page: draws the homepage's plush Harman once, head and shoulders, on a transparent canvas.
     kit/avatar@2x.png is a 512x512 headless-Chrome screenshot of this page; kit/avatar.png is that, halved.
     Serve site/ (python3 -m http.server 4377), then from site/kit:
       perl -e 'alarm 60; exec @ARGV' "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
         --enable-unsafe-swiftshader --hide-scrollbars --virtual-time-budget=15000 --window-size=512,512 \
         --default-background-color=00000000 --screenshot="$PWD/avatar@2x.png" http://127.0.0.1:4377/kit/dev/avatar.html
       cp avatar@2x.png avatar.png && sips -z 256 256 avatar.png -->
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildWorld } from '../../world/props.js';
import { buildHarman } from '../../world/characters.js';

// The curls are placed with the world's seeded random, so build the world first (and throw it away):
// that leaves the seed where the homepage leaves it, and the curls come out the same.
const cases = await fetch('../../recruit/data/cases.json').then((r) => r.json());
buildWorld(new THREE.Scene(), { cases });
const harman = buildHarman();
harman.traverse((o) => { if (o.isMesh) o.castShadow = true; });
harman.rotation.y = 0.55; // three-quarter view, facing right
// portrait touch-ups for this close-up only (the world's doll is untouched): a light, groomed beard
// with a defined moustache, and smoother felt on the face
const BEARD = 0.38, MOUSTACHE = 0.82; // alpha of the stubble and of the moustache
function beardMask(src) { // remap the world's mask (stubble grey 180, moustache white 255, mouth line black)
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = d[i], a = v <= 180 ? (v / 180) * BEARD : BEARD + ((v - 180) / 75) * (MOUSTACHE - BEARD);
    d[i] = d[i + 1] = d[i + 2] = Math.round(a * 255);
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}
harman.traverse((o) => {
  if (!o.isMesh) return;
  const m = o.material;
  if (m.alphaMap) { m.alphaMap = beardMask(m.alphaMap.image); m.opacity = 1; } // the beard shell (0.92 in the world)
  if (['#d9a07a', '#c98a66'].includes(`#${m.color.getHexString()}`)) { m.bumpScale = 0.6; m.roughness = 0.85; } // skin, nose
});

// renderer, environment and lights as in world/world.js
const canvas = document.getElementById('c'), W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const sun = new THREE.DirectionalLight('#ffe0b8', 4.2);
sun.position.set(14, 22, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 3, bottom: 0, near: 1, far: 70 }); // tight box: crisp shadows on one doll
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.035;
scene.add(harman, sun, sun.target, new THREE.HemisphereLight('#cfe4ff', '#e2b896', 0.5));
// portrait lights: a soft key from the camera side and a warm fill from the left, so the face is evenly lit
const key = new THREE.DirectionalLight('#ffe6cc', 1.0); key.position.set(1.2, 2.2, 4);
const fill = new THREE.DirectionalLight('#ffb98a', 0.6); fill.position.set(-3, 1.4, 2);
scene.add(key, fill);

// head and shoulders, camera a touch above the eyes
const camera = new THREE.PerspectiveCamera(22, W / H, 0.5, 50);
camera.position.set(0, 1.6, 3.9); camera.lookAt(0, 1.37, 0);
renderer.render(scene, camera);
document.body.dataset.ready = '1';
</script>
</body>
</html>
