<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt texture tile</title>
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  body { margin: 0; padding: 24px; font: 14px system-ui; background: #fdf4e6; color: #2d2440; }
  .demo { width: 100%; height: 360px; margin-top: 16px; border-radius: 18px; background: var(--bg) var(--tile); }
</style>
</head>
<body>
<!-- Dev page: draws the felt tile kit/felt-texture.webp is exported from (scripts/export-texture.mjs). -->
<p>256 px tile (left) and the tile repeated over cream and coral.</p>
<canvas id="tile" width="256" height="256"></canvas>
<div class="demo" style="--bg:#fff7ea"></div>
<div class="demo" style="--bg:#e8604c"></div>
<script type="module">
import { fibreCanvases } from '../../world/felt.js';
// The world's felt colour canvas is white with brown fibres and clouds. Turn it into a
// translucent overlay (brown ink whose alpha is how far each pixel is from white), so the
// same tile can sit over any background colour.
const SIZE = 256, INK = [92, 58, 36], GAIN = 0.5, STEPS = 12;
const { col } = fibreCanvases(SIZE, 4200);
const src = col.getContext('2d').getImageData(0, 0, SIZE, SIZE);
const out = document.getElementById('tile').getContext('2d');
const img = out.createImageData(SIZE, SIZE);
for (let i = 0; i < src.data.length; i += 4) {
  const a = Math.min(1, ((255 - src.data[i]) / (255 - INK[0])) * GAIN);
  img.data.set([...INK, Math.round(a * STEPS) * (255 / STEPS)], i); // few alpha levels: the lossless alpha plane compresses far better
}
out.putImageData(img, 0, 0);
const url = document.getElementById('tile').toDataURL('image/png');
for (const d of document.querySelectorAll('.demo')) d.style.setProperty('--tile', `url(${url})`);
document.body.dataset.ready = '1';
</script>
</body>
</html>
