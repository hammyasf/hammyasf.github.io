  <rect x="4" y="13" width="56" height="38" rx="10" fill="#cfe0f2"/>
  <rect x="8.5" y="17.5" width="47" height="29" rx="7" fill="none" stroke="#2d2440" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="3.2 2.6" stroke-linecap="round"/>
  <rect x="13" y="20" width="38" height="18" rx="6" fill="#fff7ea"/>
  <rect x="13" y="20" width="38" height="5" rx="2.5" fill="#e8604c"/>
