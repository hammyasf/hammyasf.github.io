<!-- Developer tools: a butter felt patch with a stitched </> -->
<symbol id="ti-dev" viewBox="0 0 64 64">
  <rect x="5" y="12" width="54" height="43" rx="13" fill="#d6a43a"/>
  <rect x="5" y="10" width="54" height="42" rx="13" fill="#f2c14e"/>
  <rect x="9.5" y="14.5" width="45" height="33" rx="9" fill="none" stroke="#2d2440" stroke-opacity=".32" stroke-width="1.6" stroke-dasharray="3.2 2.6" stroke-linecap="round"/>
  <path d="M24 22.5l-8.5 8.5 8.5 8.5M40 22.5l8.5 8.5-8.5 8.5" stroke="#2d2440" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M35.5 19.5l-7 23" stroke="#e8604c" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M12 16.5q3-3 8.5-3.2" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</symbol>
