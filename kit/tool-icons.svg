  <path d="M18 51l3.2-7.5h21.6L46 51z" fill="#8fb0d0"/>
  <circle cx="26" cy="47.5" r="1.6" fill="#cfe0f2"/>
  <circle cx="38" cy="47.5" r="1.6" fill="#cfe0f2"/>
  <path d="M10 18.5q3-3 8-3.2" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</symbol>

