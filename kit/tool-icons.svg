<svg xmlns="http://www.w3.org/2000/svg">
<!-- Plush kind icons for the Lab tool pages (kit/tool.css), one per Lab shelf. Soft felt shapes in the kit colours,
     a darker felt edge underneath, a dashed stitch sewn in, and a sheen. Use as <svg><use href="kit/tool-icons.svg#ti-ai"/></svg>. -->

<!-- AI in your browser: a little felt robot with button eyes and a pom-pom antenna -->
<symbol id="ti-ai" viewBox="0 0 64 64">
  <path d="M32 15V9" stroke="#2d2440" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="7.5" r="5" fill="#d6a43a"/>
  <circle cx="32" cy="6.5" r="5" fill="#f2c14e"/>
  <rect x="4" y="28" width="9" height="15" rx="4.5" fill="#b9442f"/>
  <rect x="51" y="28" width="9" height="15" rx="4.5" fill="#b9442f"/>
  <rect x="9" y="16" width="46" height="41" rx="16" fill="#b9442f"/>
  <rect x="9" y="14" width="46" height="40" rx="16" fill="#e8604c"/>
  <rect x="13.5" y="18.5" width="37" height="31" rx="12" fill="none" stroke="#fff7ea" stroke-width="1.7" stroke-dasharray="3.2 2.6" stroke-linecap="round" opacity=".85"/>
  <rect x="18" y="24" width="28" height="17" rx="8.5" fill="#fff7ea"/>
  <circle cx="26" cy="32.5" r="3.6" fill="#2d2440"/>
  <circle cx="38" cy="32.5" r="3.6" fill="#2d2440"/>
  <circle cx="27.2" cy="31.3" r="1.1" fill="#fff"/>
  <circle cx="39.2" cy="31.3" r="1.1" fill="#fff"/>
  <path d="M28.5 45.5q3.5 2.6 7 0" stroke="#fff7ea" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="17" cy="45" r="2.4" fill="#e86a9a" opacity=".7"/>
  <circle cx="47" cy="45" r="2.4" fill="#e86a9a" opacity=".7"/>
  <path d="M16.5 20.5q4-3.4 10.5-3.6" stroke="#fff" stroke-opacity=".5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</symbol>

<!-- Simulations & art: a plush planet with a butter ring and a stitched star -->
<symbol id="ti-sim" viewBox="0 0 64 64">
  <g transform="rotate(-16 32 34)">
    <ellipse cx="32" cy="34" rx="29" ry="8.5" fill="none" stroke="#d6a43a" stroke-width="6"/>
    <ellipse cx="32" cy="33" rx="29" ry="8.5" fill="none" stroke="#f2c14e" stroke-width="4.5"/>
  </g>
  <circle cx="32" cy="34" r="19" fill="#c04a78"/>
  <circle cx="32" cy="32" r="19" fill="#e86a9a"/>
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#fff7ea" stroke-width="1.7" stroke-dasharray="3.2 2.6" stroke-linecap="round" opacity=".8"/>
  <circle cx="25" cy="27" r="3.6" fill="#c04a78" opacity=".55"/>
  <circle cx="38.5" cy="37" r="2.6" fill="#c04a78" opacity=".55"/>
  <path d="M21.5 22q4-4.5 10-5" stroke="#fff" stroke-opacity=".5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <g transform="rotate(-16 32 34)">
    <path d="M3 34A29 8.5 0 0 0 61 34" fill="none" stroke="#d6a43a" stroke-width="6" stroke-linecap="round"/>
    <path d="M3 33A29 8.5 0 0 0 61 33" fill="none" stroke="#f2c14e" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M7 34.5A25.5 6 0 0 0 57 34.5" fill="none" stroke="#2d2440" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="2.6 2.4" stroke-linecap="round"/>
  </g>
  <path d="M53 6l1.9 4.3 4.6.5-3.5 3.1 1 4.6-4-2.4-4 2.4 1-4.6-3.5-3.1 4.6-.5z" fill="#fff7ea" stroke="#d6a43a" stroke-width="1.4" stroke-linejoin="round"/>
</symbol>

<!-- Files, sound & media: a felt cassette tape with cream reels -->
