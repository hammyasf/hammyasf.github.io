  <circle cx="41" cy="31.5" r="5.2" fill="#2d2440"/>
  <circle cx="23" cy="31.5" r="2.1" fill="#f2c14e"/>
  <circle cx="41" cy="31.5" r="2.1" fill="#f2c14e"/>
