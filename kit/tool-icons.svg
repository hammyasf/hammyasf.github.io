  <rect x="21" y="8" width="39" height="28" rx="12" fill="#2c5a3d"/>
  <path d="M47 31l8 10-1.5-10z" fill="#3f7a55"/>
  <rect x="21" y="6" width="39" height="28" rx="12" fill="#3f7a55"/>
  <rect x="25.5" y="10.5" width="30" height="19" rx="8" fill="none" stroke="#fff7ea" stroke-width="1.6" stroke-dasharray="3.2 2.6" stroke-linecap="round" opacity=".7"/>
  <path d="M15 52l-5 9 13-9z" fill="#e2cdb0"/>
  <rect x="4" y="26" width="39" height="28" rx="12" fill="#e2cdb0"/>
  <path d="M15 50l-5 9 13-9z" fill="#fff7ea"/>
  <rect x="4" y="24" width="39" height="28" rx="12" fill="#fff7ea"/>
